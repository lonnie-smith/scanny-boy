[project]
name = "scanny-boy"
version = "0.3.0"
description = "Scanny Boy CLI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rawpy>=0.27,<0.28",
    "numpy>=2.5,<3",
    "tifffile>=2026.8.23,<2027",
    "imagecodecs>=2026.8.16,<2027",
    "exifread>=3.5,<4",
    "tifftools>=1.7,<2",
    "opencv-python-headless>=4.14,<5",
    "scipy>=1.14,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.scripts]
scanny-boy = "scanny_boy.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanny_boy"]

[tool.pytest.ini_options]
testpaths = ["src"]
