[project]
name = "scanny-boy"
version = "0.3.0"
description = "Scanny Boy CLI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rawpy>=0.27,<0.28",
    "numpy>=2.5,<3",
    "tifffile>=2026.8.23,<2027",
    "imagecodecs>=2026.8.16,<2027",
    "exifread>=3.5,<4",
    "tifftools>=1.7,<2",
    "opencv-python-headless>=4.14,<5",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.scripts]
scanny-boy = "scanny_boy.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyinstaller",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanny_boy"]

[tool.pytest.ini_options]
testpaths = ["src"]
# Parallel by default (pytest-xdist). Real-sample tests (raw NEF fixtures at
# tests/fixtures/nef/) are marked `real_samples` and deselected from the
# normal run: they cost minutes of RAW decoding and stitching. Run them
# explicitly when the fixtures are present:
#   uv run pytest -m real_samples   # only the real-sample tests
#   uv run pytest -m ""             # everything
addopts = "-n auto -m 'not real_samples'"
markers = [
    "real_samples: needs the real sample NEFs (skipped when the fixtures are absent, and deselected from the default run)",
]
