[project]
name = "scanny-boy"
version = "0.1.0"
description = "Scanny Boy CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scanny-boy = "scanny_boy.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanny_boy"]

[tool.pytest.ini_options]
testpaths = ["src"]
